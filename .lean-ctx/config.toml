[cloud]
contribute_enabled = false

[autonomy]
enabled = true
auto_preload = true
auto_dedup = true
auto_related = true
auto_consolidate = true
silent_preload = true
dedup_threshold = 8
consolidate_every_calls = 25
consolidate_cooldown_secs = 120
cognition_loop_enabled = true
cognition_loop_interval_secs = 3600
cognition_loop_max_steps = 8

[providers]
enabled = true
auto_index = true
cache_ttl_secs = 120

[providers.github]
enabled = true

[providers.gitlab]
enabled = true

[providers.mcp_bridges]

[proxy]

[loop_detection]
normal_threshold = 2
reduced_threshold = 4
blocked_threshold = 0
window_secs = 300
search_group_limit = 10

[loop_detection.tool_total_limits]
ctx_search = 80
ctx_read = 100
ctx_semantic_search = 60
ctx_shell = 50

[archive]
enabled = true
threshold_chars = 4096
max_age_hours = 48
max_disk_mb = 500

[memory.knowledge]
max_facts = 200
max_patterns = 50
max_history = 100
contradiction_threshold = 0.5
recall_facts_limit = 10
rooms_limit = 25
timeline_limit = 25
relations_limit = 40

[memory.episodic]
max_episodes = 500
max_actions_per_episode = 50
summary_max_chars = 200

[memory.procedural]
min_repetitions = 3
min_sequence_len = 2
max_procedures = 100
max_window_size = 10

[memory.lifecycle]
decay_rate = 0.009999999776482582
low_confidence_threshold = 0.30000001192092896
stale_days = 30
similarity_threshold = 0.8500000238418579

[memory.embeddings]
max_facts = 2000

[memory.gotcha]
max_gotchas_per_project = 100
retrieval_budget_per_room = 10
default_decay_rate = 0.029999999329447746

[memory.gotcha.category_decay_overrides]

[updates]
auto_update = true
check_interval_hours = 6
notify_only = false

[lsp]

[ide_paths]

[model_context_windows]

[boundary_policy]
cross_project_search = false
cross_project_import = false
audit_cross_access = true
universal_gotchas_enabled = true

[secret_detection]
enabled = true
redact = false
custom_patterns = []
